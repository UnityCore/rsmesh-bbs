################################
##  RSMesh-BBS Configuration  ##
##                            ##
##        Version 1.1         ##
################################


############################
####        BBS         ####
############################
# board_name - name displayed in banners and the main menu header
# eventbus_topic - PyPubSub topic for Meshtastic receive events
#   (default: meshtastic.receive)
# core_bulletins - Enable the Bulletins service (default: true)
# core_mail - Enable the Mail service (default: true)
# core_channels - Enable the Channels service (default: true)
# mail_commands_on_main_menu - when true, show Read/Send Mail options on the
#   mesh main menu and remove separate Mail sub-menu (default: false)
# send_urgent_alert_local - true/false broadcast on primary channel when an
#   Urgent bulletin is posted locally (default: false)
# send_urgent_alert_from_sync - true/false broadcast when an Urgent bulletin is
#   ingested from a sync peer (default: false)
# superuser_node - node ID with Urgent bulletin board posting permission
#   (Ex. "!17d7e4b7")

bbs:
  board_name: RSMesh BBS
  eventbus_topic: meshtastic.receive
  core_bulletins: true
  core_mail: true
  core_channels: true
  mail_commands_on_main_menu: false
  send_urgent_alert_local: false
  send_urgent_alert_from_sync: false
  superuser_node: ""


###############################
#### Select Interface type ####
###############################
# port - serial device path when type is serial; omit when only one device is attached
#   Linux: /dev/ttyUSB0 or /dev/ttyACM0
#   macOS: /dev/cu.usbmodem101 (run: ls /dev/cu.*)
#   Windows: COM3
# type - serial for USB connected devices, or tcp for network-connected ESP32 devices
# hostname - required when type is tcp (not WisBlock), e.g. 192.168.1.100

interface:
  port: /dev/ttyUSB0
  # port: /dev/ttyACM0
  # port: COM3
  # hostname: 192.168.1.100
  type: serial
  # type: tcp


##########################
####    Schedule      ####
##########################
# peer_sync_minutes - minutes between retries for unsynced
#   bulletin/mail/channel records
# module_exec_minutes - interval for the core module schedule worker
#   (modules register their own tasks within this tick)
# sync_purge_minutes - minutes between checks to purge deleted bulletins
# bulletin_display_age_days - days of non-pinned bulletins shown on mesh boards

schedule:
  peer_sync_minutes: 5
  module_exec_minutes: 1
  sync_purge_minutes: 5
  bulletin_display_age_days: 30
